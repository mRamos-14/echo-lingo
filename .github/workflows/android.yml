# Builds the Echo Lingo apps on every push and publishes them as one GitHub Release:
#   Android: https://github.com/mRamos-14/echo-lingo/releases/latest/download/echo-lingo.apk
#   Windows: https://github.com/mRamos-14/echo-lingo/releases/latest/download/echo-lingo-windows.exe
# The Android app is signed with the key in repo secrets ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD
# (Settings → Secrets and variables → Actions). Without them the APK is built but not published.
name: Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-release
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lessons and teaching order
        run: python3 engine/bake.py --check

  android:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: v
        run: |
          V=$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" js/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version $V"

      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::The APK will be built but not published: add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repo secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Bundle the web app
        run: |
          mkdir -p app/www
          cp -r manifest.webmanifest css js data audio icons app/www/
          cp play/index.html app/www/index.html   # the app opens straight into the game

      - name: Create the Android project (Capacitor)
        working-directory: app
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mramos14.echolingo",
            "appName": "Echo Lingo",
            "webDir": "www",
            "android": { "backgroundColor": "#161513" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Icons, splash, version
        working-directory: app/android/app
        run: |
          RES=src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../../../android-res/mipmap-$d/*.png $RES/mipmap-$d/
          done
          find $RES -name 'splash.png' -exec cp ../../../android-res/splash.png {} \;
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#4F46E5</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          sed -i -E "s/versionCode 1\b/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.version }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        if: steps.key.outputs.ok == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias echolingo \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out echo-lingo.apk aligned.apk
          "$BT/apksigner" verify --print-certs echo-lingo.apk | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
          ls -la echo-lingo.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: echo-lingo.apk

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the web app
        shell: bash
        run: |
          mkdir -p desktop/www
          cp -r manifest.webmanifest css js data audio icons desktop/www/
          cp play/index.html desktop/www/index.html   # the app opens straight into the game

      - name: Build the Windows app (Electron)
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund --save-dev electron@33.2.1 electron-builder@25.1.8
          npx electron-builder --win portable --publish never
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/echo-lingo-windows.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.android.outputs.version }}
        run: |
          ls -la out
          TAG="v$V"
          gh release delete "$TAG" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" out/* --latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Echo Lingo $V" \
            --notes "Android: download echo-lingo.apk on your phone, open it, allow installing from your browser if asked. Windows: download echo-lingo-windows.exe and run it (More info → Run anyway if SmartScreen asks). Installing a new version keeps your progress. Full steps: https://mramos-14.github.io/echo-lingo/download.html"
