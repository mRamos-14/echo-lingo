# Builds the Echo Lingo Android app (APK) on every push and publishes it as a GitHub Release.
# Fixed download link: https://github.com/mRamos-14/echo-lingo/releases/latest/download/echo-lingo.apk
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD. Until they exist, the build is skipped.
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Skipping the Android build: add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repo secrets first."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        id: v
        run: |
          V=$(grep -oP "version: '\K[^']+" js/version.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version $V"

      - name: Bundle the web app
        run: |
          mkdir -p app/www
          cp -r index.html manifest.webmanifest css js data audio icons app/www/

      - name: Create the Android project (Capacitor)
        working-directory: app
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mramos14.echolingo",
            "appName": "Echo Lingo",
            "webDir": "www",
            "android": { "backgroundColor": "#161513" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Icons, splash, version
        working-directory: app/android/app
        run: |
          RES=src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../../../android-res/mipmap-$d/*.png $RES/mipmap-$d/
          done
          find $RES -name 'splash.png' -exec cp ../../../android-res/splash.png {} \;
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#4F46E5</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          sed -i -E "s/versionCode 1\b/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.version }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Build
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        if: steps.key.outputs.ok == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias echolingo \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out echo-lingo.apk aligned.apk
          "$BT/apksigner" verify --print-certs echo-lingo.apk | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
          ls -la echo-lingo.apk

      - name: Publish release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$V"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" echo-lingo.apk --latest \
            --title "Echo Lingo $V (Android)" \
            --notes "Install: download echo-lingo.apk on your Android phone, open it, and allow installing from your browser if asked. Updating: install the new APK over the old one; your progress stays."
